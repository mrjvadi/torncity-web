<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>آزمایش حالت شخصیت</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:system-ui,Vazirmatn,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;left:6px;top:6px;z-index:5;font:11px/1.4 monospace;color:#fff;background:#000a;padding:4px 7px;border-radius:6px;direction:ltr;max-width:calc(100% - 20px)}
#msg{display:none;position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;font-size:18px;background:#101820}
#stick{display:none;position:fixed;left:24px;bottom:28px;width:110px;height:110px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff55;z-index:5;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffffaa}
#toggle{position:fixed;right:8px;top:8px;z-index:7;padding:8px 12px;border-radius:10px;border:0;background:#f4c441;font-weight:700}
#creator{position:fixed;right:8px;top:52px;z-index:6;width:230px;max-height:calc(100% - 140px);overflow:auto;background:#101c2ccc;color:#fff;border-radius:12px;padding:10px;display:none;font-size:13px}
#creator.open{display:block}
#creator label{display:block;margin:8px 0 3px;opacity:.8}
#creator input[type=range]{width:100%}
#creator .row{display:flex;flex-wrap:wrap;gap:4px}
#creator .row button{min-width:28px;height:28px;border-radius:7px;border:1px solid #fff5;background:#243650;color:#fff;padding:0}
#creator #skin button,#creator #haircol button{width:28px;border:2px solid #fff8}
#rand{margin-top:8px;width:100%;height:34px;border-radius:8px;border:0;background:#56d447;font-weight:700}
#bytes{margin-top:6px;font:10px monospace;direction:ltr;opacity:.7}
</style></head><body>
<div id="hud">…</div><div id="msg"></div>
<button id="toggle">چهره</button>
<div id="creator">
<label>قد</label><input id="height" type="range" min="0" max="100" value="50">
<label>هیکل</label><input id="build" type="range" min="0" max="100" value="50">
<label>رنگ پوست</label><div class="row" id="skin"></div>
<label>مو</label><div class="row" id="hair"></div>
<label>رنگ مو</label><div class="row" id="haircol"></div>
<label>صورت</label><div class="row" id="face"></div>
<button id="rand">شانسی</button><div id="bytes"></div>
</div>
<div id="stick"><div id="knob"></div></div>
<script type="module" src="./app.js?v=2"></script>
</body></html>
